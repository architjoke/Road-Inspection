[pytest]
testpaths = tests
markers =
    real_model: tests that load artifacts/ai_models/best.pt on CPU
# Layout:
#   tests/unit         pure functions / services, no web client
#   tests/integration  Flask test client, offline store (no live database)
#   tests/e2e          real YOLO weights on CPU (slow)
# Run a subset with e.g.  python -m pytest tests/unit
filterwarnings =
    ignore::DeprecationWarning
