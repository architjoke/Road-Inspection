{% extends "base.html" %}

{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <p class="page-kicker">Accounts</p>
        <h1>{{ page_title }}</h1>
        <p class="text-muted mb-0">{{ account.username }}</p>
    </div>
    <a class="btn btn-outline-primary" href="{{ url_for('protected.users') }}">Back to users</a>
</div>

<div class="content-card">
    <form method="POST" class="p-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label" for="full_name">Full name</label>
                <input class="form-control" id="full_name" name="full_name" required
                       value="{{ account.full_name or '' }}">
            </div>
            <div class="col-md-6">
                <label class="form-label" for="email">Email</label>
                <input class="form-control" id="email" name="email" type="email" required
                       value="{{ account.email or '' }}">
            </div>
            <div class="col-md-6">
                <label class="form-label" for="phone">Phone</label>
                <input class="form-control" id="phone" name="phone" value="{{ account.phone or '' }}">
            </div>
            <div class="col-md-6">
                <label class="form-label" for="role_id">Role</label>
                <select class="form-select" id="role_id" name="role_id">
                    {% for value, label in roles %}
                    <option value="{{ value }}" {% if account.role_id == value or account.role_name == value %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            {% if is_super %}
            <div class="col-md-6">
                <label class="form-label" for="municipality_id">Municipality</label>
                <select class="form-select" id="municipality_id" name="municipality_id">
                    <option value="">—</option>
                    {% for m in municipalities %}
                    <option value="{{ m.id }}" {% if account.municipality_id == m.id %}selected{% endif %}>{{ m.name }}</option>
                    {% endfor %}
                </select>
            </div>
            {% endif %}
            <div class="col-md-6">
                <label class="form-label" for="password">Reset password (optional)</label>
                <input class="form-control" id="password" name="password" type="password" minlength="8">
            </div>
            <div class="col-md-6 d-flex align-items-end">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" value="1" id="is_active" name="is_active"
                           {% if account.is_active %}checked{% endif %}>
                    <label class="form-check-label" for="is_active">Active</label>
                </div>
            </div>
        </div>
        <button class="btn btn-primary mt-4" type="submit">Save changes</button>
    </form>
</div>
{% endblock %}
