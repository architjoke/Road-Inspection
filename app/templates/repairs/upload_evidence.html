{% extends "base.html" %}

{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <p class="page-kicker">Evidence</p>
        <h1>{{ page_title }}</h1>
        <p class="text-muted mb-0">Repair #{{ repair.id }} — {{ repair.location }}</p>
    </div>
    <a class="btn btn-outline-primary" href="{{ url_for('protected.repair_detail', repair_id=repair.id) }}">Back</a>
</div>

<div class="content-card">
    <form method="POST" enctype="multipart/form-data" class="p-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
            <label class="form-label" for="evidence">After-repair photo</label>
            <input class="form-control" type="file" id="evidence" name="evidence" accept="image/*">
        </div>
        <div class="mb-3">
            <label class="form-label" for="evidence_note">Notes</label>
            <textarea class="form-control" id="evidence_note" name="evidence_note" rows="3"
                      placeholder="Describe the completed work"></textarea>
        </div>
        <button class="btn btn-primary" type="submit">Save evidence</button>
        <a class="btn btn-outline-secondary" href="{{ url_for('protected.repairs_verify') }}">Compare with SSIM</a>
    </form>
</div>
{% endblock %}
