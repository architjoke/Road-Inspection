<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ error_title or "System Error" }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5">
    <div class="card shadow-sm mx-auto" style="max-width: 32rem;">
        <div class="card-body p-4">
            <h1 class="h3">{{ error_title or "System Error" }}</h1>
            <p class="text-muted">
                {{ error_message or "An unexpected error occurred. Please try again." }}
            </p>
            <a class="btn btn-primary" href="/dashboard">Go to Dashboard</a>
            <a class="btn btn-outline-secondary" href="/login">Go to Login</a>
        </div>
    </div>
</main>
</body>
</html>
